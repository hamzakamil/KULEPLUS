<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışısınız — Kuleplus</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .card {
        max-width: 30rem;
        padding: 2rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #fff;
        text-align: center;
      }
      .mark {
        font-size: 2rem;
        color: #1d4ed8;
      }
      h1 {
        margin: 0.5rem 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #475569;
        line-height: 1.55;
      }
      button {
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">▲</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>
        Kuleplus çevrimdışıda yalnızca önceki ekranları gösterir. Finansal kayıtlar
        çevrimdışı olarak değiştirilemez — bağlandığınızda kaldığınız yerden devam edin.
      </p>
      <button type="button" onclick="window.location.replace('/')">Yeniden dene</button>
    </main>
  </body>
</html>
