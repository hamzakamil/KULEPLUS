# Faz 0 — Altyapı iskeleti (README §12.2)
# Kullanım: docker compose up -d
# Servisler: PostgreSQL 16, Redis, MinIO (S3), Mailpit (dev e-posta)
#
# `name` AÇIKÇA sabitlenmiştir: Compose proje adını normalde dizin adından
# türetir ("Muhasebe" → muhasebe). Dizin taşınıp yeniden adlandırılırsa proje
# adı değişir ve `pgdata` → <yeni-ad>_pgdata diye BOŞ bir volume'e bakardı
# (veri silinmez, ama uygulama boş şemaya bakar). Bu satır bugünkü davranışla
# birebir aynı olduğu için hiçbir konteyner/volume yeniden oluşturulmaz.
name: muhasebe
services:
  postgres:
    image: postgres:16-alpine
    container_name: kuleplus-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      # Varsayılan 5432 (README §12.3). Yerel makinede başka Postgres varsa
      # .env'de POSTGRES_PORT=5433 gibi ayarlayın; README URL'lerini de güncelleyin.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp_db']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kuleplus-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kuleplus-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin # .env'de S3_ACCESS_KEY ile değiştirin
      MINIO_ROOT_PASSWORD: minioadmin # .env'de S3_SECRET_KEY ile değiştirin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: kuleplus-mailpit
    ports:
      - '1025:1025' # SMTP (README §12.3: smtp://localhost:1025)
      - '8025:8025' # Web UI

volumes:
  pgdata:
  miniodata:
