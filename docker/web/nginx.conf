# KULEPLUS WEB — nginx (statik SPA + /api ters vekili)
#
# Bu sunucu Node ÇALIŞTIRMAZ; yalnızca Dockerfile.web'in ürettiği statik dosyaları
# verir ve API isteklerini compose ağındaki `api` servisine iletir.

server {
    listen 80;
    server_name _;

    root  /srv/web;
    index index.html;

    # İletişim formu/ek dosyaları için makul tavan; aksi halde nginx 1m ile kırpar.
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    # --- sağlık ucu (compose healthcheck'i; dosyaya dokunmaz) ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API ters vekili ---
    # `proxy_pass` sondaki `/` OLMADAN yazılır: özgün URI olduğu gibi iletilir ve
    # API'nin `/api/v1/...` mount'u korunur (yanlışlıkla `/` eklemek yolu kırpar).
    location /api {
        # Hedef DEĞİŞKEN üzerinden ve her istekte yeniden çözülür. Düz
        # `proxy_pass http://api:3000;` nginx açılırken BİR KEZ çözer ve:
        #   a) `api` o an yoksa nginx HİÇ başlamaz (başlangıç sırasına bağımlılık),
        #   b) api yeniden başladığında (deploy/oom-restart) IP bayatlar ve
        #      `/api` istekleri reload'a kadar 502 döner — seste görünmeyen hata.
        # 127.0.0.11 = Docker'ın gömülü DNS'i. Değişkenli proxy_pass'ta URI
        # belirtilmediği için özgün istek yolu (~/api/v1/...) aynen iletilir.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kuleplus_api http://api:3000;
        proxy_pass $kuleplus_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # API, CORS/secure-cookie ve hız sınırlarında bu başlıkları kullanır.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Dış kenar (Caddy) TLS'i sonlandırıp `X-Forwarded-Proto: https` yollar.
        # `$scheme` (iç ağ = http) ile EZMEYİZ: aşağıdaki map dış değeri korur.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE/yükseltme varsa kesilmesin.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       off;
    }

    # --- PWA: servis worker ve manifest ASLA aggressive cache'lenmez ---
    # vite-plugin-pwa `registerType: autoUpdate` kullanır; sw.js bayatlamışsa
    # kullanıcı sonsuza dek eski sürümü görür.
    location = /sw.js              { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }
    location = /registerSW.js      { add_header Cache-Control "no-cache"; }

    # --- Girdi noktası: cache'lenmez (aksi halde yeni deploy görünmez) ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Hash'li varlıklar: içerik adı değiştiği için 1 yıl güvenli ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA yönlendirme: olmayan yol index.html'e düşer (Vue Router history) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kasa/geçici dosyalar ve kaynak haritaları dışarı sızmasın.
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.map$           { deny all; }
}

# $connection_upgrade: Upgrade başlığı varsa "upgrade", yoksa boş bırakılır.
# (nginx.conf'un http bloğunda tanımlı değişkenler conf.d/*.conf ile aynı kapsamda.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# X-Forwarded-Proto: dış kenarın (Caddy) bildirdiği şemayı KORU. Caddy TLS'i burada
# sonlandırdığı için değer `https` olur; nginx `$scheme` (=iç ağ, http) yazsaydı
# zincirin dışındaki HTTPS bilgisi kaybolurdu.
# Yalnızca `https` geçirilir (beyaz liste). Caddy bu başlığı istemciden gelen değerle
# birleştirmez, her zaman kendi bağlantı şemasıyla YAZAR; dolayısıyla internetten gelen
# sahte `X-Forwarded-Proto: https` buraya hiç ulaşamaz. Kenar atlanıp nginx'e doğrudan
# erişilirse taklit en fazla "daha sıkı" davranış üretir, aleyhe işlemez.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}
